name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - state.json
      - venues.json
      - seasons/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
